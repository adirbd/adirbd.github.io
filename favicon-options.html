<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favicon options</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0b0f17;color:#e5e7eb;margin:0;padding:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#111827;border:1px solid #263247;border-radius:12px;padding:16px}
    .row{display:flex;gap:12px;align-items:center}
    img{background:#0b1020;border-radius:8px;padding:8px}
    .sm{width:16px;height:16px}.md{width:32px;height:32px}.lg{width:64px;height:64px}
    code{font-size:12px;color:#93c5fd}
  </style>
</head>
<body>
  <h1>Favicon Options</h1>
  <div class="grid">
    <div class="card">
      <h3>Option A (minimal A)</h3>
      <div class="row"><img class="sm" src="./images/favicon-option-a.svg"><img class="md" src="./images/favicon-option-a.svg"><img class="lg" src="./images/favicon-option-a.svg"></div>
      <p><code>images/favicon-option-a.svg</code></p>
    </div>
    <div class="card">
      <h3>Option AB (clear initials)</h3>
      <div class="row"><img class="sm" src="./images/favicon-option-ab.svg"><img class="md" src="./images/favicon-option-ab.svg"><img class="lg" src="./images/favicon-option-ab.svg"></div>
      <p><code>images/favicon-option-ab.svg</code></p>
    </div>
    <div class="card">
      <h3>Option Monogram (BD-forward)</h3>
      <div class="row"><img class="sm" src="./images/favicon-option-monogram.svg"><img class="md" src="./images/favicon-option-monogram.svg"><img class="lg" src="./images/favicon-option-monogram.svg"></div>
      <p><code>images/favicon-option-monogram.svg</code></p>
    </div>
  </div>
</body>
</html>
