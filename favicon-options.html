<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favicon candidate</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0b0f17;color:#e5e7eb;margin:0;padding:24px}
    .card{max-width:420px;background:#111827;border:1px solid #263247;border-radius:12px;padding:16px}
    .row{display:flex;gap:12px;align-items:center}
    img{background:#0b1020;border-radius:8px;padding:8px}
    .sm{width:16px;height:16px}.md{width:32px;height:32px}.lg{width:64px;height:64px}
    code{font-size:12px;color:#93c5fd}
  </style>
</head>
<body>
  <h1>Favicon Candidate</h1>
  <div class="card">
    <h3>Transit clean # + subtle nodes</h3>
    <div class="row">
      <img class="sm" src="./images/favicon-transit.svg" alt="16px"/>
      <img class="md" src="./images/favicon-transit.svg" alt="32px"/>
      <img class="lg" src="./images/favicon-transit.svg" alt="64px"/>
    </div>
    <p><code>images/favicon-transit.svg</code></p>
  </div>
</body>
</html>
