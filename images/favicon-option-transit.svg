<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Transit-system hashtag favicon">
  <defs>
    <linearGradient id="hashBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0b1530"/>

  <!-- Clear hashtag behind A (horizontal bars extend beyond A so # is visible even at 16px) -->
  <g stroke="url(#hashBlue)" stroke-linecap="round" opacity="0.98">
    <!-- vertical stems -->
    <path d="M22 13 L16.5 51" stroke-width="4.1"/>
    <path d="M42 13 L36.5 51" stroke-width="4.1"/>
    <!-- horizontal bars, deliberately long -->
    <path d="M9.5 24 H50.5" stroke-width="4"/>
    <path d="M8.5 40 H49.5" stroke-width="4"/>
  </g>

  <!-- subtle station dots -->
  <g fill="#a5f3fc" opacity="0.95">
    <circle cx="22" cy="24" r="1.7"/>
    <circle cx="42" cy="24" r="1.7"/>
    <circle cx="19.5" cy="40" r="1.7"/>
    <circle cx="39.5" cy="40" r="1.7"/>
  </g>

  <!-- Foreground A (narrowed center so hash bars stay visible) -->
  <path d="M15 52 L31 12 H33.6 L49 52 H42.3 L39.1 43.2 H25.1 L21.7 52 Z M32.1 24.8 L29.1 34 H35.2 Z" fill="#ffffff"/>
</svg>
