<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Transit hashtag with outlined A favicon">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hashBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0b1530"/>

  <!-- vertical rails -->
  <g stroke="url(#rail)" stroke-linecap="round" opacity="0.95">
    <path d="M22 12 L16.5 52" stroke-width="4.1"/>
    <path d="M42 12 L36.5 52" stroke-width="4.1"/>
  </g>

  <!-- bold horizontal bars to make # obvious (as in your sketch) -->
  <g stroke="url(#hashBlue)" stroke-linecap="round" opacity="0.98">
    <path d="M9 24 H51" stroke-width="4.3"/>
    <path d="M8 40 H50" stroke-width="4.3"/>
  </g>

  <!-- network nodes -->
  <g fill="#93c5fd" opacity="0.95">
    <circle cx="22" cy="24" r="1.6"/>
    <circle cx="42" cy="24" r="1.6"/>
    <circle cx="19.5" cy="40" r="1.6"/>
    <circle cx="39.5" cy="40" r="1.6"/>
  </g>

  <!-- foreground A with outline -->
  <path d="M15 52 L31 12 H33.8 L49 52 H42.1 L38.9 43.2 H25.2 L21.8 52 Z M32.2 24.8 L29 34.2 H35.4 Z"
        fill="#ffffff" stroke="#0b1530" stroke-width="1.9"/>
</svg>
