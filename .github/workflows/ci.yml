name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shared markup is in sync
        run: |
          python3 scripts/sync_shared.py
          git diff --exit-code || {
            echo "::error::Pages drifted from scripts/sync_shared.py — run it and commit the result."
            exit 1
          }

      - name: Assets are real images under the size budget
        run: bash scripts/check_assets.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright smoke and link tests
        run: npx playwright test
